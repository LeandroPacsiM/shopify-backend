spring.application.name=plataforma-tiendas

# Flyway es dueño del esquema; JPA nunca lo toca.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# V1 vive en classpath (copia congelada de shopify_db/database/01_esquema_shopify.sql);
# V2+ se leen del repo para no duplicar. Si Render usa otra carpeta de trabajo,
# ajustar esta ruta o copiar las migraciones al construir.
spring.flyway.locations=classpath:db/migration,filesystem:../shopify_db/database/migrations
spring.flyway.validate-on-migrate=true

# Auth CUSTOMER (ADR-016, plan v5): habilitado tras el cutover F3/F4.
# Se conserva como kill-switch (p. ej. `auth.customer.enabled=false`).
auth.customer.enabled=${AUTH_CUSTOMER_ENABLED:true}
# Secreto HMAC-SHA256 para códigos (≥32 caracteres, solo en entorno).
cliente.codigo.hmac-secret=${CLIENTE_CODIGO_HMAC_SECRET:}
cliente.codigo.ttl-minutos=10
cliente.codigo.intentos-max=5
cliente.codigo.max-hora-cuenta=5
cliente.codigo.max-hora-ip=30
cliente.codigo.reenvio-segundos=60
# IP real tras proxy (rate limiting por IP, condición 4 de ejecución).
server.forward-headers-strategy=native
