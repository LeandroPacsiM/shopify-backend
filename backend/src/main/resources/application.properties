spring.application.name=plataforma-tiendas

# Flyway es dueño del esquema; JPA nunca lo toca.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# V1 vive en classpath (copia congelada de shopify_db/database/01_esquema_shopify.sql);
# V2+ se leen del repo para no duplicar. Si Render usa otra carpeta de trabajo,
# ajustar esta ruta o copiar las migraciones al construir.
spring.flyway.locations=classpath:db/migration,filesystem:../shopify_db/database/migrations
spring.flyway.validate-on-migrate=true
