# Blueprint todo-en-Render: backend Docker + Postgres (ver diagramas/00).
# Uso: Dashboard -> Blueprints -> New Blueprint Instance -> repo + rama main.
services:
  - type: web
    name: shopify-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /v3/api-docs
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: shopify-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CRYPTO_MASTER_KEY
        sync: false
      - key: CLIENTE_CODIGO_HMAC_SECRET
        sync: false
      - key: CORS_ORIGENES
        sync: false
      - key: MAIL_PROVEEDOR
        value: resend
      - key: MAIL_RESEND_KEY
        sync: false
      - key: MAIL_REMITENTE
        sync: false
      - key: AUTH_CUSTOMER_ENABLED
        value: true

databases:
  - name: shopify-db
    databaseName: shopify_db
    user: shopify
    plan: free
