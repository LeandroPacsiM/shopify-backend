# Perfil prod: Supabase (BD) + Render (app).
# DATABASE_URL la pone el entorno (connection string de Supabase).
spring.datasource.url=${DATABASE_URL}
spring.datasource.hikari.maximum-pool-size=20

# Obligatoria en prod, sin default.
crypto.master-key=${CRYPTO_MASTER_KEY}
# Obligatorio en prod, sin default.
jwt.secret=${JWT_SECRET}
cookie.secure=true
# Orígenes del SPA en prod (Render), separados por coma. Sin esto el
# navegador bloquea al frontend (RNF-SEG-02).
app.cors.origenes=${CORS_ORIGENES:}
# Proveedor y llaves de correo por entorno (RNF-SEG-04).
mail.proveedor=${MAIL_PROVEEDOR:resend}

# Flyway migra solo hacia adelante; jamás repara ni revierte.
spring.flyway.out-of-order=false
logging.level.com.tienda.plataforma=INFO
