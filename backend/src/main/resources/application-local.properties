# Perfil dev: todo local (PostgreSQL + pgAdmin).
# Uso: -Dspring.profiles.active=local
spring.datasource.url=jdbc:postgresql://localhost:5432/shopify_db_demo
spring.datasource.username=postgres
spring.datasource.password=${PGPASSWORD:1234}
spring.datasource.hikari.maximum-pool-size=10

# En dev se permite recrear desde cero para iterar.
spring.sql.init.mode=never
# Llave SOLO dev (32 bytes en Base64). En prod viene del entorno.
crypto.master-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
# JWT dev (mínimo 32 caracteres). En prod viene del entorno.
jwt.secret=dev-jwt-secreto-largo-solo-local-0123456789
cookie.secure=false
# SPA local (Vite). En prod se fija por entorno.
app.cors.origenes=http://localhost:5173,http://localhost:3000
logging.level.com.tienda.plataforma=DEBUG
