# Perfil exclusivo de pruebas automatizadas. No apunta a shopify_db_demo.
spring.datasource.url=jdbc:postgresql://localhost:5432/shopify_db_test
spring.datasource.username=postgres
spring.datasource.password=${PGPASSWORD:1234}
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=never

# Auth CUSTOMER habilitado en suite (cutover F3 verificado aquí).
auth.customer.enabled=true

# Secretos ficticios exclusivos del classpath de tests.
crypto.master-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
jwt.secret=test-jwt-secreto-largo-solo-local-0123456789
cliente.codigo.hmac-secret=test-hmac-customer-solo-local-0123456789
cookie.secure=false

# Correo en modo log sin proveedor externo; tampoco registrar códigos en la salida de tests.
mail.proveedor=resend
mail.resend.key=
mail.brevo.key=
mail.log-permitido=true
mail.remitente=test@example.invalid
logging.level.com.tienda.plataforma.shared.mail=OFF

# NOTA: el tope de contextos Spring vivos NO va aquí (Spring lo lee antes de
# que exista el Environment); está como system property en el surefire del pom.
# Cada contexto retiene su pool Hikari (10).

app.cors.origenes=http://localhost:5173,http://localhost:3000
