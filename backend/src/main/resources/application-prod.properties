# Perfil prod: todo en Render (app + Postgres).
# DATABASE_URL la pone Render (postgres://...); el entrypoint Docker la
# convierte a jdbc:postgresql://... y separa usuario/clave.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
# Render asigna el puerto por $PORT.
server.port=${PORT:8080}

# Obligatoria en prod, sin default.
crypto.master-key=${CRYPTO_MASTER_KEY}
# Obligatorio en prod, sin default.
jwt.secret=${JWT_SECRET}
cookie.secure=true
# Orígenes del SPA en prod (Render), separados por coma. Sin esto el
# navegador bloquea al frontend (RNF-SEG-02).
app.cors.origenes=${CORS_ORIGENES:}
# Proveedor y llaves de correo por entorno (RNF-SEG-04).
mail.proveedor=${MAIL_PROVEEDOR:resend}
# Sin llave no hay fallback a log en prod: falla cerrado (AUTH-04).
mail.log-permitido=false

# Flyway migra solo hacia adelante; jamás repara ni revierte.
spring.flyway.out-of-order=false
logging.level.com.tienda.plataforma=INFO
